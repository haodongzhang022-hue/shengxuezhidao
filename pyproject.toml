[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shengxuezhidao"
version = "0.1.0"
description = "全球Top500大学升学智能查询系统本体 - 多路径检索 + 学生画像坍缩推荐 + AI知识库问答"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "山东予路 张浩东" }]
keywords = ["留学", "升学", "QS", "大学申请", "AI", "知识库"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "requests>=2.28"]
http = ["flask>=2.2", "flask-cors>=3.0"]
ai = ["openai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
